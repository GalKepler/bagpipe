# bag models train-stacked --config config/models/stacked.yaml
features:
  metrics: [vol_gm, vol_wm, vol_csf] # grouped per region (not flattened)
  # This config trains on the retired pooled `cat12` source (no datasets_dir
  # override -> get_path("datasets_dir")). Volume-only by choice — surface
  # metrics live on a different atlas (surf_*) and, as of the region-mapping
  # fusion fix, sharing them with volume needs `atlases:` restricted to one
  # parcellation family (see stacked_v26_surface.yaml). Use stacked_v26.yaml
  # for the current (CAT26) training cohort.
stacker:
  base_estimator:
    type: ridgecv
  meta_estimator:
    type: ridgecv
  outer_cv: 5
  inner_cv: 3
  n_jobs: -1
  random_state: 0
bias_correction: cole # none | cole | beheshti
n_splits: 5
mlflow:
  experiment: bagpipe-baseline
  run_name: stacked-ridgecv-cole
