# bag models train-sfcn --config config/models/sfcn.yaml
#
# Update (2026-08-19, reverted): UKB-pretrained fine-tune killed — val_mae
# stuck ~29-30y through epoch 4/8 (vs raw-baseline-beating scratch numbers),
# worse than not using the pretrained weights at all. Root cause not fully
# diagnosed (candidates: lr=1e-5 still too aggressive for a loaded net,
# input normalization mismatch with the UKB preprocessing pipeline, or the
# remapped state dict silently dropping something beyond the classifier
# head) — worth revisiting, but not blocking scratch training. Back to
# from-scratch, still carrying the real kernel_size=1x1x1 fix from that
# commit (applies regardless of pretrained_weights_path).
#
# Budget note: full rigor (n_splits=5 + nested Cole bias-correction CV,
# ~51h) is too slow for this GPU; 5 outer folds, no bias correction,
# epochs capped at 15 with patience=5 (~7h estimated from small-sample
# benchmark — real runs have come in ~2x that in practice, budget for it).
# batch_size=2 because the 8GB card typically has only ~5-6GB free (desktop
# session shares it) — batch_size=8 OOM'd.
#
# Update (2026-08-19c): architecture review before this overnight run —
# BatchNorm3d swapped for GroupNorm (batch_size=2 gives BatchNorm noisy,
# near-meaningless running stats — likely cause of the fine-tune
# instability above too), added AMP (autocast+GradScaler, cuts activation
# memory so batch_size=2 isn't as tight), added train-only flip+affine
# augmentation, and fixed a real leakage bug: the inner train/val split
# used for early stopping was a plain random split, not subject-grouped —
# violated the non-negotiable grouped-CV rule at the inner level even
# though the outer harness enforced it correctly. All four in sfcn.py.
#
# Result (2026-08-19c, completed): mae_raw=mae_corrected=7.447 (bias
# correction is "none" here, so those are identical by construction, not a
# bug). Worse than the stacked ensemble (4.7-4.8y). Maintainer initially
# read the earlier from-scratch run's lower val_mae (~3.5, in
# outputs/mlruns/sfcn_runs/sfcn-scratch-overnight-2026-08-19/history.csv)
# as a better baseline to revert to — but that run was killed early
# (fold 1 epoch 1, see a861b73's own commit message: "its metrics are not
# comparable to a completed run either way") AND used the leaky
# non-grouped inner split this commit fixed, so its number is invalid on
# two counts. No valid pre-fix baseline exists to compare against.
# `norm` is now config-driven (`model.norm: group|batch`) instead of a
# hardcoded swap, so BatchNorm was re-tried under the *correct* grouped
# split in sfcn_batchnorm.yaml — a proper ablation of the one change above
# that's actually easy to get wrong at batch_size=2.
#
# Result (2026-08-20, sfcn-scratch-batchnorm-ablation): mae_raw=mae_
# corrected=4.675 — beats GroupNorm's 7.447 by a wide margin and lands on
# par with the stacked ensemble (4.7-4.8y). The GroupNorm swap's rationale
# (BatchNorm's per-step running stats are too noisy at batch_size=2) was
# never actually validated and turned out wrong on a fair, completed
# comparison — BatchNorm's running-average stats across the full epoch
# apparently overcome the per-step noise fine here. Switching the default
# back to `norm: batch`; GroupNorm stays available as an option, see
# sfcn.py's SFCN docstring.
model:
  epochs: 15
  batch_size: 2
  lr: 0.0001
  weight_decay: 0.001
  dropout: 0.5
  norm: batch
  num_workers: 6
  val_fraction: 0.1
  patience: 5
  pretrained_weights_path: null # UKB fine-tune underperformed scratch, see note above
  verbose: true # per-epoch train_loss/val_mae prints, for tracking an overnight run's progress
bias_correction: none # deferred — see budget note above
n_splits: 5
mlflow:
  experiment: bagpipe-baseline
  # unchanged from sfcn_batchnorm.yaml on purpose: this config is now
  # identical to the one that actually produced the 4.675 result above —
  # re-running would log to the same completed run name, which is correct
  # (idempotent re-run, not a new experiment).
  run_name: sfcn-scratch-batchnorm-ablation-2026-08-20
