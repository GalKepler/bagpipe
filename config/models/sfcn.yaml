# bag models train-sfcn --config config/models/sfcn.yaml
#
# Update (2026-08-19): switched to fine-tuning from UKB-pretrained SFCN
# weights instead of from-scratch (the from-scratch overnight run was killed
# early, fold 1 epoch 1, to free the GPU for this — its metrics are not
# comparable to a completed run either way). Fine-tuning converges much
# faster than scratch training on this dataset size, so epochs/patience are
# cut down rather than reusing the scratch budget. lr lowered 10x (1e-5) —
# fine-tuning a pretrained net with the scratch LR risks wrecking the loaded
# weights in the first few steps. Fixing the pretrained load also fixed a
# real bug: the last conv block used kernel_size=3 like every other block,
# but the paper (and this checkpoint) use a 1x1x1 kernel there — the
# scratch run trained under the wrong architecture too.
#
# Budget note (unchanged from the scratch run): full rigor (n_splits=5 +
# nested Cole bias-correction CV) is too slow for this GPU at this per-epoch
# cost; still deferring bias correction to a follow-up run.
# batch_size=2 because the 8GB card typically has only ~5-6GB free (desktop
# session shares it) — batch_size=8 OOM'd.
model:
  epochs: 8
  batch_size: 2
  lr: 0.00001
  weight_decay: 0.001
  dropout: 0.5
  num_workers: 6
  val_fraction: 0.1
  patience: 3
  pretrained_weights_path: /media/storage/bagpipe/outputs/pretrained/ukb_sfcn_run20190719_00_epoch_best_mae.p
  verbose: true # per-epoch train_loss/val_mae prints, for tracking an overnight run's progress
bias_correction: none # deferred — see budget note above
n_splits: 5
mlflow:
  experiment: bagpipe-baseline
  run_name: sfcn-ukb-finetune-2026-08-19
