# bag models train-stacked --config config/models/stacked_surface.yaml
# Opt-in variant including cortical thickness (surf_DK40/surf_Destrieux).
# Surface coverage is now ~93% of the reprocessed cohort (was 2/180 when this
# comment was first written) — build_region_matrix no longer drops rows
# missing a metric column (median-imputed fold-internally instead), so this
# trains on the full pool. No `atlases:` filter here, unlike
# stacked_v26_surface.yaml, so thickness is pulled from BOTH surf_DK40 and
# surf_Destrieux (different parcellations from the Schaefer volume atlas) —
# region fusion (atlas__region canonicalization) does not apply across
# different parcellations, so these stay separate single-modality blocks.
features:
  metrics: [vol_gm, vol_wm, vol_csf, thickness]
stacker:
  base_estimator:
    type: ridgecv
  meta_estimator:
    type: ridgecv
  outer_cv: 5
  inner_cv: 3
  n_jobs: -1
  random_state: 0
bias_correction: cole # none | cole | beheshti
n_splits: 5
mlflow:
  experiment: bagpipe-baseline
  run_name: stacked-ridgecv-cole-surface
