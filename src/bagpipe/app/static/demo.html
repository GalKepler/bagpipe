<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>cortex-viewer demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f0e;
        font-family: system-ui, sans-serif;
      }
      #viewer {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #e6e6e1;
        font-size: 13px;
        pointer-events: none;
      }
      #scroll {
        position: fixed;
        bottom: 12px;
        left: 12px;
        width: 240px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="hud">hover: <span id="hover-region">–</span></div>
    <input id="scroll" type="range" min="0" max="1" step="0.001" value="0" />

    <script type="module">
      import { CortexViewer } from "./js/cortex-viewer.js";

      const viewer = new CortexViewer(document.getElementById("viewer"), {
        glbUrl: "./mesh/cortex.glb",
      });

      const hoverEl = document.getElementById("hover-region");
      viewer.addEventListener("regionhover", (e) => {
        hoverEl.textContent = e.detail.regionId ?? "–";
      });

      viewer.addEventListener("ready", async () => {
        const regions = await fetch("./mesh/regions.json").then((r) => r.json());
        const values = {};
        for (const id of Object.values(regions)) {
          if (Math.random() < 0.6) values[id] = (Math.random() * 2 - 1) * 3;
        }
        viewer.setRegionValues(values);
      });

      document.getElementById("scroll").addEventListener("input", (e) => {
        viewer.setScrollProgress(Number(e.target.value));
      });
    </script>
  </body>
</html>
