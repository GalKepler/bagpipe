[project]
name = "bagpipe"
version = "0.1.0"
description = "Brain Age Gap PIPEline — SNBB modeling, causal analysis, and public reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "mlflow>=2.14",
    "cloudpickle>=3.0",
    "regional-stacker @ git+https://github.com/GalKepler/regional-stacker.git@v1.0.0",
    "torch>=2.13.0",
    "monai>=1.6.0",
    "nibabel>=5.4.2",
]

[project.scripts]
bag = "bagpipe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit",
    "jupyter",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagpipe"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"] # exploration-only; nbstripout handles output hygiene, not lint

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
